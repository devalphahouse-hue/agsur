version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - flutter
    # Pacotes do Supabase têm versões pinadas em conjunto pelo FlutterFlow.
    ignore:
      - dependency-name: "supabase_flutter"
      - dependency-name: "supabase"
      - dependency-name: "gotrue"
      - dependency-name: "postgrest"
      - dependency-name: "realtime_client"
      - dependency-name: "storage_client"
      - dependency-name: "functions_client"

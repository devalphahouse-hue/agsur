name: Deploy painel to Vercel

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - "supabase/**"
      - "RUNBOOK.md"
      - "SECURITY.md"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Build web (release)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # --no-tree-shake-icons: o tree-shake do MaterialIcons gera um
          # MaterialIcons-Regular.otf cujo conteúdo MUDA entre builds (só
          # entram os ícones referenciados pelo Dart). Com asset cache,
          # browsers que pegaram o font de um build velho ficam com ícones
          # quebrados (caixinhas □) nos ícones novos. Build mais pesado
          # (~600KB gzip a mais), mas font estável entre deploys.
          flutter build web --release \
            --no-tree-shake-icons \
            --dart-define=APP_ENV=production \
            --dart-define=APP_RELEASE=agsur-painel@${GITHUB_SHA::7} \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Inject build id (cache-bust do main.dart.js)
        run: |
          # Substitui o placeholder __AGSUR_BUILD_ID__ pelo short-sha no
          # build/web/index.html (onde o flutter_bootstrap.js está inlined)
          # e em build/web/flutter_bootstrap.js. Sem essa substituição,
          # o bootstrap cai num fallback de Date.now() — funciona mas não
          # aproveita cache entre visitas do mesmo deploy.
          SHA="${GITHUB_SHA::7}"
          sed -i "s/__AGSUR_BUILD_ID__/${SHA}/g" build/web/index.html build/web/flutter_bootstrap.js
          # Sanity: confirma que substituiu pelo menos uma ocorrência.
          if grep -q "__AGSUR_BUILD_ID__" build/web/index.html; then
            echo "::error::Falha ao injetar AGSUR_BUILD_ID em build/web/index.html"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifact (uses build/web via vercel.json)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to Vercel (production)
        run: |
          vercel deploy --prebuilt --prod --yes \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --meta githubCommitSha=$GITHUB_SHA \
            --meta githubCommitRef=$GITHUB_REF_NAME

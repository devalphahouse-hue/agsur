name: Publish sprint backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agsur-production-database
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link and review migrations
        run: |
          set -eu
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref bkzybtmxxzpxtztesdye
          supabase migration list
          supabase db push --dry-run
      - name: Apply reviewed migrations
        run: supabase db push --yes
      - name: Configure the private scheduler key
        shell: python
        run: |
          import json, os, pathlib, secrets, subprocess, tempfile, urllib.request
          secret = secrets.token_hex(32)
          print('::add-mask::' + secret, flush=True)
          descriptor, filename = tempfile.mkstemp()
          try:
            with os.fdopen(descriptor, 'w') as f:
              f.write('SIGNATURE_DISPATCH_SECRET=' + secret + '\n')
            subprocess.run(['supabase', 'secrets', 'set', '--env-file', filename,
                            '--project-ref', 'bkzybtmxxzpxtztesdye'], check=True)
            request = urllib.request.Request(
              'https://api.supabase.com/v1/projects/bkzybtmxxzpxtztesdye/database/query',
              headers={'Authorization': 'Bearer ' + os.environ['SUPABASE_ACCESS_TOKEN'],
                       'Content-Type': 'application/json'},
              data=json.dumps({'query': "select public.configure_signature_dispatcher('" + secret + "')"}).encode())
            with urllib.request.urlopen(request, timeout=30) as response:
              response.read()
          finally:
            pathlib.Path(filename).unlink(missing_ok=True)
      - name: Publish authenticated workers and signed webhooks
        run: |
          set -eu
          supabase functions deploy whatsapp-reminders --project-ref bkzybtmxxzpxtztesdye
          supabase functions deploy whatsapp-webhook --project-ref bkzybtmxxzpxtztesdye
          supabase functions deploy contract-signatures --project-ref bkzybtmxxzpxtztesdye
          supabase functions deploy clicksign-webhook --project-ref bkzybtmxxzpxtztesdye
      - name: Confirm migration state
        run: supabase migration list

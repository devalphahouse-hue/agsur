name: Supabase DB check

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-db-check.yml"
  push:
    branches: [main, master]

jobs:
  db-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate migrations syntax (lint)
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            echo "::group::Lint $f"
            # Reject CR/LF mistakes and missing semicolons at end
            test -s "$f" || { echo "Empty migration: $f"; exit 1; }
            tail -c1 "$f" | grep -q "^$" || echo "::warning::$f does not end with newline"
            echo "::endgroup::"
          done
      - name: Dry-run db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret não configurado — pulando dry-run."
            exit 0
          fi
          supabase link --project-ref bkzybtmxxzpxtztesdye --password "$SUPABASE_DB_PASSWORD"
          supabase db push --dry-run

name: Supabase DB check

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-db-check.yml"
  push:
    branches: [main, master]

jobs:
  db-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate migrations syntax (lint)
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            echo "::group::Lint $f"
            # Reject CR/LF mistakes and missing semicolons at end
            test -s "$f" || { echo "Empty migration: $f"; exit 1; }
            tail -c1 "$f" | grep -q "^$" || echo "::warning::$f does not end with newline"
            echo "::endgroup::"
          done
      - name: Dry-run db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Secret ausente = FALHA, nunca skip. Até 2026-08-06 este passo fazia
          # `exit 0` com um ::warning:: — o check ficava verde sem ter validado
          # migration nenhuma (assim ficou desde 2026-07-11, sem ninguém notar).
          # Isso NÃO mudou: sem o token o passo continua falhando.
          #
          # Desde 2026-09-22 só o TOKEN é obrigatório. O CLI novo não usa a senha
          # do banco para isto — ele cria um login role temporário pela
          # Management API ("Initialising login role...") e conecta por ela.
          # Verificado em 2026-09-22 num clone que nunca foi linkado, com
          # SUPABASE_DB_PASSWORD ausente: `link` e `db push --dry-run` passaram.
          # Exigir a senha deixava o check vermelho por um segredo que o comando
          # não consome — era o único motivo de ele estar vermelho. A senha
          # continua sendo usada quando existir (CLI antigo conecta direto).
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret ausente: SUPABASE_ACCESS_TOKEN — o dry-run NÃO rodou."
            echo "Cadastre em Settings → Secrets and variables → Actions do repo"
            echo "devalphahouse-hue/agsur. Token: https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          set -e
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref bkzybtmxxzpxtztesdye --password "$SUPABASE_DB_PASSWORD"
          else
            supabase link --project-ref bkzybtmxxzpxtztesdye
          fi
          supabase db push --dry-run

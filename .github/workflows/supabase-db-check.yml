name: Supabase DB check

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/sales_flow.test.mjs"
      - "supabase/config.toml"
      - ".github/workflows/supabase-db-check.yml"
  push:
    branches: [main, master]

jobs:
  sales-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/sales-tests" @electric-sql/pglite@0.5.9
      - run: PGLITE_MODULE="$RUNNER_TEMP/sales-tests/node_modules/@electric-sql/pglite/dist/index.js" node --test supabase/tests/sales_flow.test.mjs
  db-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Validate migrations syntax (lint)
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            echo "::group::Lint $f"
            # Reject CR/LF mistakes and missing semicolons at end
            test -s "$f" || { echo "Empty migration: $f"; exit 1; }
            tail -c1 "$f" | grep -q "^$" || echo "::warning::$f does not end with newline"
            echo "::endgroup::"
          done
      - name: Dry-run db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # CLI v3 creates a temporary database login from this token.
          # Missing credentials must fail instead of skipping validation.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret ausente: SUPABASE_ACCESS_TOKEN — o dry-run NÃO rodou."
            echo "Cadastre em Settings → Secrets and variables → Actions do repo"
            echo "devalphahouse-hue/agsur. Token: https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          set -e
          supabase db push --remote=bkzybtmxxzpxtztesdye --dry-run --skip-vault

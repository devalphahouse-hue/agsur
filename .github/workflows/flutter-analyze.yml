name: Flutter analyze

on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - ".github/workflows/flutter-analyze.yml"
  push:
    branches: [main, master]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # Painel é gerado pelo FlutterFlow — milhares de info/warning toleradas.
      # CI quebra apenas em ERROR (regressão real).
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
